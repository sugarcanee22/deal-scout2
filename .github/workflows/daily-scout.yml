name: Daily Deal Scout
on:
  schedule:
    - cron: "0 0 * * *" # runs 8:00 AM Singapore time daily
  workflow_dispatch: # lets you trigger it manually to test

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scout script
        run: node scout.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push results
        run: |
          git config user.name "Deal Scout Bot"
          git config user.email "bot@deal-scout"
          git add results.json
          git commit -m "Daily deal scan: $(date +'%Y-%m-%d')" || echo "No changes"
          git add scout.js && git commit -m "add scout script" && git push
